
services:
  postgres:
    image: postgres:17
    container_name: ai-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_agent
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:    